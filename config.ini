; Hybrid FTP runtime configuration.
;
; Both server.py and client.py read this file at startup (via config.py).
; Every key below is optional — anything omitted falls back to the Basic
; Level default noted in the comment, so deleting this file (or a key)
; reproduces the original Basic Level behavior exactly.

[server]
host = 0.0.0.0

; Concurrency model (Advanced Level rubric item).
;   single = one client at a time (Basic Level default, no isolation needed)
;   thread = one thread per client session (Advanced Level)
; Note: FIXED-mode data transfers share one UDP socket across all sessions,
; so true concurrent-transfer isolation requires clients to use active/passive
; mode (see README.md "Concurrency" section). threading=thread still isolates
; the TCP control channel and directory/session state either way.
threading = thread

; Root directory for stored files/folders, relative to this file (or absolute).
storage_root = server_storage

; IP address to advertise in PASV replies. Leave blank to auto-detect from
; the server's own socket (correct on a LAN/loopback). Set this explicitly
; when the server sits behind NAT (e.g. a cloud VM reachable only via its
; public IP) so passive-mode clients get a reachable address.
advertise_ip = 20.249.210.239

; Restrict ACTIVE/PASSIVE per-session UDP sockets to this port range instead
; of a random OS-assigned ephemeral port. Needed behind a cloud firewall/NSG
; that only opens specific ports (like Azure's default: only 2121/2122 are
; open) — open this same range on the firewall once, instead of every random
; port PASV/PORT might pick. Leave both blank to keep using random ports
; (fine on a LAN/loopback with no firewall in the way).
passive_port_min = 50000
passive_port_max = 50050

[client]
; Data-channel mode to negotiate automatically right after login.
;   fixed   = Basic Level: HELLO to the server's fixed UDP port (default)
;   active  = Advanced Level: client sends PORT, server connects back to it
;   passive = Advanced Level: client sends PASV, connects to server's port
; Can still be switched live in the REPL with the `active`/`passive`/`fixed`
; commands regardless of this default.
data_mode = passive

; Where `get` saves files when no local path is given, relative to client.py.
download_dir = client_downloads

[reliability]
; Excellent Level: custom Go-Back-N reliable-UDP layer + sliding-window flow
; control. Read by BOTH server.py and client.py — both ends must agree, the
; same way two TCP stacks must speak the same protocol version; there's no
; way for one side to opt out while the other expects GBN framing.
;   none = best-effort UDP (Basic/Advanced Level default, what an absent
;          config.ini reproduces): checksummed and sequenced, but no
;          ACK/retransmit — a lost packet silently truncates the transfer.
;   gbn  = Go-Back-N: sliding window of `window_size` unacked packets in
;          flight, cumulative ACKs, timeout-based retransmission of the
;          whole window on loss. See the comment above gbn_send()/
;          gbn_receive() in common.py for the full state-machine writeup.
mode = gbn

; Sliding window size (packets allowed in flight before waiting for an ACK)
; — the flow-control knob: larger = more throughput but a lost packet costs
; more to retransmit (the whole window is resent, not just the lost packet);
; smaller = more conservative, closer to Stop-and-Wait as it approaches 1.
window_size = 4

; Per-packet retransmission timeout, in milliseconds.
rto_ms = 300

; Consecutive timeouts to tolerate before giving up on the whole transfer
; (peer presumed gone / genuinely unreachable).
max_retries = 30

[integrity]
; Excellent Level: end-to-end MD5/SHA-256 hash comparison. `hash <filename>`
; always works standalone as a REPL command regardless of this setting;
; `verify = true` additionally runs it automatically after every put/get,
; comparing the locally-computed hash against the server's HASH reply for
; the same file and printing MATCH/MISMATCH.
verify = true
algorithm = sha256   ; sha256 | md5
